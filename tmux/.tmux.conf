set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

bind R source-file ~/.tmux.conf


# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Resize the current pane using Alt + direction
bind -n S-k resize-pane -U 25
bind -n S-j resize-pane -D 25
bind -n S-h resize-pane -L 25
bind -n S-l resize-pane -R 25

# Disable disconnect on session kill
set -g detach-on-destroy off

# set vi-mode and enable vim-tmux pane changes
set-window-option -g mode-keys vi

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Kill panes and windows without confirmation
bind x kill-pane
bind X kill-window

# Split panes
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Setup continous session saving
run-shell ~/clone/path/continuum.tmux
set -g @continuum-restore 'on'


# Installed plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'niksingh710/minimal-tmux-status'

# Status bar configuration (uses environment variables from .env)
# Fallback to defaults if env vars not set
%if "#{==:#{TMUX_STATUS_SESSION_NAME},}"
  set -g @minimal-tmux-status-left "tmux"
%else
  set -g @minimal-tmux-status-left "#{TMUX_STATUS_SESSION_NAME}"
%endif

set -g @minimal-tmux-status-right "#S"

%if "#{==:#{TMUX_STATUS_BG},}"
  set -g @minimal-tmux-bg "#53575e"
%else
  set -g @minimal-tmux-bg "#{TMUX_STATUS_BG}"
%endif

%if "#{==:#{TMUX_STATUS_FG},}"
  set -g @minimal-tmux-fg "#000000"
%else
  set -g @minimal-tmux-fg "#{TMUX_STATUS_FG}"
%endif


# Run all plugins' scripts
run '~/.tmux/plugins/tpm/tpm'
